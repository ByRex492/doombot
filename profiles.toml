# Perfiles de hardware de D.O.O.M
# ==============================================================================
# El mismo commit corre en el sobremesa y en el portatil porque el codigo no
# sabe en que equipo esta: mide la VRAM disponible al arrancar y elige de aqui.
#
# La seleccion no usa el nombre del equipo ni el del usuario a proposito. Un
# hostname cambia, una tarjeta se sustituye, y el proyecto tiene que seguir
# eligiendo bien sin tocar codigo. La VRAM es el dato del que dependen de
# verdad las decisiones.
#
# Gana el perfil de mayor min_vram_mb que no supere la VRAM detectada.

schema = 1

# ------------------------------------------------------------------------------
[profiles.workstation]
description = "Sobremesa con GPU dedicada holgada. Modelo y voz caben juntos en VRAM."
min_vram_mb = 8192

llm_model   = "gemma4:12b"
llm_num_ctx = 8192
llm_num_gpu = 0        # 0 = que decida Ollama; aqui sobra VRAM y acierta
llm_keep_alive = "-1"  # residente: no compite con nada

stt_model   = "small"
stt_device  = "cuda"
stt_compute = "float16"

# ------------------------------------------------------------------------------
[profiles.laptop]
description = "Portatil con GPU pequena. La VRAM da para el modelo y para nada mas."
min_vram_mb = 2048

llm_model   = "llama3.2:3b"
llm_num_ctx = 4096
llm_keep_alive = "5m"

# num_gpu = 99 fuerza a subir todas las capas. Medido en una GTX 1050 (3 GB):
# con el valor por defecto Ollama reparte 49/51 CPU/GPU aunque el modelo quepa
# —reserva margen de forma conservadora— y baja de 29,3 a 12,3 tok/s.
llm_num_gpu = 99

# La voz va en CPU porque no queda VRAM: con el modelo dentro sobran 489 MiB.
# Medido: RTF 0,15 en reposo y 0,16 con el modelo generando a la vez, o sea
# entre un 7% y un 12% de penalizacion. El reparto se sostiene.
stt_model   = "small"
stt_device  = "cpu"
stt_compute = "int8"

# ------------------------------------------------------------------------------
[profiles.cpu_only]
description = "Sin GPU utilizable. Todo en CPU; el modelo baja de tamano."
min_vram_mb = 0

llm_model   = "qwen3:1.7b"
llm_num_ctx = 2048
llm_num_gpu = 0
llm_keep_alive = "5m"

stt_model   = "base"
stt_device  = "cpu"
stt_compute = "int8"
