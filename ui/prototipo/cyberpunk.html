<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOM · cyberpunk</title>
<style>
  /* ---------------------------------------------------------------
     PALETA
     Duotono: --h (cian) es el acento principal, --h2 (magenta) el de
     contraste. El resto de direcciones derivaban todo de un solo matiz;
     esta necesita dos para el choque de color tipico cyberpunk, pero
     sigue habiendo una sola fuente de verdad por canal.
     --------------------------------------------------------------- */
  :root{
    --h: 188;                 /* cian, matiz principal */
    --h2: 322;                /* magenta, contraste */
    --bg-0: #030509;
    --bg-1: #060a14;
    --txt:  hsl(var(--h) 35% 88%);
    --dim:  hsl(var(--h) 20% 50%);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(130% 95% at 50% 40%, var(--bg-1) 0%, var(--bg-0) 60%, #000 100%);
    color: var(--txt);
    font-family: "Cascadia Mono",Consolas,ui-monospace,monospace;
    display:grid; place-items:center;
    user-select:none;
    -webkit-font-smoothing: antialiased;
  }

  /* Rejilla de fondo: perspectiva sutil, apenas visible, para dar
     profundidad tecnica sin competir con el anillo. */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(hsl(var(--h) 60% 60% / .05) 1px, transparent 1px),
      linear-gradient(90deg, hsl(var(--h) 60% 60% / .05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(70% 60% at 50% 45%, #000 30%, transparent 78%);
  }
  /* Scanlines: la textura CRT que separa "neon" de "cyberpunk". Muy
     tenue a proposito -- una pasada visible, no ruido que canse la
     vista en una interfaz que va a estar encendida horas. */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.12) 3px, rgba(0,0,0,0) 4px
    );
    mix-blend-mode: multiply;
  }
  /* Vineta, en su propia capa porque ya se uso ::after para scanlines. */
  #stage::after{
    content:""; position:fixed; inset:-40vmax; pointer-events:none;
    background: radial-gradient(75% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.78) 100%);
  }

  /* ---------------------------------------------------------------
     ESCENARIO
     Tres lienzos apilados. `fx` dibuja nítido; los otros dos reciben
     una copia reducida de `fx` y la desenfocan por CSS. Eso produce
     el "bloom" (resplandor) sin coste de calculo en JavaScript.
     --------------------------------------------------------------- */
  #stage{
    position:relative; z-index:1;
    width:min(78vmin,640px); aspect-ratio:1;
  }
  #stage canvas{ position:absolute; inset:0; width:100%; height:100%; }
  /* Marcas de esquina tipo mira/objetivo, duotono. CSS puro: cuatro
     trazos fijos, sin coste de canvas. */
  #corners{ position:absolute; inset:-22px; pointer-events:none; }
  #corners i{ position:absolute; width:26px; height:26px; font-style:normal; }
  #corners i:nth-child(1){ top:0; left:0; border-top:2px solid hsl(var(--h) 70% 55% / .6); border-left:2px solid hsl(var(--h) 70% 55% / .6); }
  #corners i:nth-child(2){ top:0; right:0; border-top:2px solid hsl(var(--h2) 70% 55% / .6); border-right:2px solid hsl(var(--h2) 70% 55% / .6); }
  #corners i:nth-child(3){ bottom:0; left:0; border-bottom:2px solid hsl(var(--h2) 70% 55% / .6); border-left:2px solid hsl(var(--h2) 70% 55% / .6); }
  #corners i:nth-child(4){ bottom:0; right:0; border-bottom:2px solid hsl(var(--h) 70% 55% / .6); border-right:2px solid hsl(var(--h) 70% 55% / .6); }
  /* `screen` hace que el resplandor SUME luz en lugar de superponer una
     imagen semitransparente. Sin esto el bloom apaga la escena en vez de
     encenderla, que es justo el error que hacia ver el HUD apagado.
     Menos difuminado que en un HUD con mas elementos: aqui no hay nada
     mas que el anillo, asi que su borde tiene que seguir leyendose limpio. */
  #bloomB{ filter: blur(30px) saturate(1.5); opacity:1; mix-blend-mode:screen; }
  #bloomA{ filter: blur(9px) saturate(1.25); opacity:1; mix-blend-mode:screen; }
  #fx    { filter: none; }

  /* Texto: en HTML, no en canvas. Mas nitido y mas facil de retocar. */
  #hud-text{
    position:fixed; left:0; right:0; bottom:12vh; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    pointer-events:none;
  }
  #estado{
    font-weight:600;
    font-size:11px; letter-spacing:.56em; text-indent:.56em;
    color: hsl(var(--h) 55% 62%);
    text-shadow: 0 0 8px hsl(var(--h) 80% 55% / .55);
    transition: color .3s ease, text-shadow .3s ease;
  }
  #lectura{
    font-size:9.5px; letter-spacing:.16em; color: hsl(var(--h2) 45% 55% / .65);
    font-variant-numeric: tabular-nums;
  }
  #caption{
    max-width:min(60vw,520px); text-align:center;
    font-size:clamp(13.5px,1.8vmin,17px); line-height:1.6;
    font-weight:400; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    color: hsl(var(--h) 25% 82%);
    opacity:0; transform:translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
    text-wrap:balance;
  }
  #caption.on{ opacity:.92; transform:none; }

  /* ---------------------------------------------------------------
     PANEL DE PRUEBAS  (no forma parte del HUD final: tecla H)
     --------------------------------------------------------------- */
  #panel{
    position:fixed; left:16px; top:16px; width:252px;
    background:rgba(5,8,14,.86); backdrop-filter:blur(12px);
    border:1px solid hsl(var(--h) 55% 55% / .25);
    border-left:2px solid hsl(var(--h) 70% 55% / .65);
    padding:14px; font-size:12px; z-index:10;
    transition:opacity .25s ease, transform .25s ease;
  }
  #panel.hidden{ opacity:0; transform:translateX(-14px); pointer-events:none; }
  #panel h4{ font-size:10px; letter-spacing:.22em; color: hsl(var(--h2) 40% 60% / .8);
             font-weight:600; margin:14px 0 7px; }
  #panel h4::before{ content:'// '; color:hsl(var(--h) 45% 55% / .6); }
  #panel h4:first-child{ margin-top:0; }
  .row{ display:flex; flex-wrap:wrap; gap:5px; }

  /* Estado del transporte: visible de un vistazo, no enterrado en las
     estadisticas de texto de mas abajo. */
  #ws-badge{
    display:flex; align-items:center; gap:6px;
    font-size:10.5px; color:var(--dim); margin-bottom:12px;
  }
  #ws-badge .punto{
    width:7px; height:7px; border-radius:50%;
    background:hsl(0 60% 55%); flex:none;
    transition:background .2s ease, box-shadow .2s ease;
  }
  #ws-badge.on{ color:hsl(var(--h) 30% 85%); }
  #ws-badge.on .punto{
    background:hsl(150 65% 55%);
    box-shadow:0 0 6px hsl(150 65% 55% / .7);
  }

  /* Medidor de amplitud: mismo dato que mueve el anillo, en una barra,
     para poder juzgar nivel/saturacion sin mirar el orbe. */
  #vu{
    height:5px; border-radius:3px; margin:6px 0 2px;
    background:hsl(var(--h) 30% 50% / .12); overflow:hidden;
  }
  #vu-fill{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg, hsl(var(--h) 70% 55%), hsl(20 85% 60%));
    transition:width .05s linear;
  }
  .error-linea{ color:hsl(340 75% 68%); font-size:10px; line-height:1.5; margin-top:4px; }
  button{
    font:inherit; font-size:11px; cursor:pointer;
    background:hsl(var(--h) 40% 60% / .08);
    border:1px solid hsl(var(--h) 45% 60% / .28);
    color:hsl(var(--h) 30% 82%);
    padding:5px 9px; transition:background .15s, border-color .15s;
  }
  button:hover{ background:hsl(var(--h) 45% 60% / .18); border-color:hsl(var(--h) 60% 60% / .5); }
  button.act{ background:hsl(var(--h2) 70% 45% / .28);
              border-color:hsl(var(--h2) 75% 60% / .7); color:#fff;
              box-shadow:0 0 10px hsl(var(--h2) 70% 50% / .25); }
  .swatch{ width:24px; height:24px; padding:0; border-radius:50%; }
  textarea, select{
    width:100%; font:inherit; font-size:11.5px; margin-bottom:6px;
    background:hsl(var(--h) 30% 50% / .08);
    border:1px solid hsl(var(--h) 40% 60% / .22);
    color:hsl(var(--h) 20% 90%); padding:6px 8px;
    resize:vertical;
  }
  textarea:focus, select:focus{ outline:1px solid hsl(var(--h2) 70% 55% / .6); }
  select option{ background:#0a1018; }
  .nota{ color:var(--dim); font-size:10px; line-height:1.5; margin-top:4px; }
  label.sl{ display:block; margin:9px 0 2px; color:var(--dim); font-size:11px; }
  input[type=range]{ width:100%; accent-color:hsl(var(--h2) 70% 55%); }
  #stats{ margin-top:12px; color:var(--dim); font-size:10.5px;
          font-family:"Cascadia Mono",Consolas,monospace; line-height:1.6; }
  kbd{ background:hsl(var(--h) 30% 60% / .14); border-radius:4px;
       padding:1px 4px; font-family:inherit; font-size:10px; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="bloomB"></canvas>
  <canvas id="bloomA"></canvas>
  <canvas id="fx"></canvas>
  <div id="corners"><i></i><i></i><i></i><i></i></div>
</div>

<div id="hud-text">
  <div id="estado">DORMIDO</div>
  <div id="lectura"></div>
  <div id="caption"></div>
</div>

<div id="panel">
  <div id="ws-badge"><span class="punto"></span><span id="ws-texto">sin servidor</span></div>

  <h4>ESTADO</h4>
  <div class="row" id="btn-estados"></div>

  <h4>FUENTE DE AMPLITUD</h4>
  <div class="row" id="btn-fuente"></div>
  <div id="vu"><div id="vu-fill"></div></div>

  <h4>ACENTO</h4>
  <div class="row" id="btn-color"></div>

  <label class="sl">Reactividad <span id="v-react"></span></label>
  <input type="range" id="s-react" min="0" max="200" value="100">
  <label class="sl">Densidad de particulas <span id="v-part"></span></label>
  <input type="range" id="s-part" min="0" max="160" value="0">
  <label class="sl">Resplandor <span id="v-glow"></span></label>
  <input type="range" id="s-glow" min="0" max="200" value="100">

  <h4>BANCO DE PRUEBAS &mdash; TEXTO Y VOZ</h4>
  <textarea id="txt" rows="3">Diecinueve grados en el exterior. Cielo despejado hasta la tarde.</textarea>
  <select id="sel-voz"></select>
  <label class="sl">Cadencia <span id="v-rate"></span></label>
  <input type="range" id="s-rate" min="60" max="120" value="88">
  <div class="row">
    <button id="b-decir">&#9654; Decir</button>
    <button id="b-parar">&#9632; Parar</button>
  </div>
  <div class="row" style="margin-top:5px">
    <button id="b-escuchar">&#127908; Escuchar (mantener)</button>
  </div>
  <div class="nota" id="nota-voz"></div>
  <div class="error-linea" id="error-mic" hidden></div>

  <div class="row" style="margin-top:12px">
    <button id="b-demo">&#9654; Ciclo completo</button>
  </div>

  <div id="stats"></div>
</div>

<script>
"use strict";

/* =================================================================
   1. CONTRATO CON EL ORQUESTADOR
   -----------------------------------------------------------------
   Todo lo que Python necesita para pilotar el HUD son estas cuatro
   funciones. La interfaz no decide nada: recibe estado, amplitud y
   texto, y se limita a animar. Este objeto es el borrador del
   contrato definitivo (entregable n.3).
   ================================================================= */
const DOOM = {
  setState(nombre){ transicionar(nombre); },                     // 'dormido' | 'escuchando' | ...
  amplitude(v){ if(fuente === 'ext') ampTarget = clamp(v,0,1); },// 0..1, a 30-60 Hz
  caption(txt){ ponerTexto(txt); },
  reset(){ transicionar('dormido'); ponerTexto(''); }
};
window.DOOM = DOOM;

/* =================================================================
   2. DEFINICION DE LOS ESTADOS
   -----------------------------------------------------------------
   Cada estado es un conjunto de numeros. La transicion entre estados
   interpola esos numeros, asi que no hay saltos: el orbe se transforma
   de forma continua. Anadir un estado nuevo es anadir una fila aqui.

   dh      desplazamiento de matiz respecto al acento
   sat/lum saturacion y luminosidad del nucleo
   R       radio base (fraccion del lienzo)
   react   cuanto deforma la amplitud el anillo
   glow    intensidad general de brillo
   spin    velocidad de rotacion del anillo de marcas
   orbit   opacidad de los arcos orbitales (protagonistas en PENSANDO)
   caos    ruido de alta frecuencia (solo ERROR)
   ================================================================= */
const ESTADOS = {
  dormido:    { et:'DORMIDO',    dh:  0, sat:22, lum:42, R:.30, react:.15, glow:.30, spin:.020, orbit:.06, caos:0, breath:.055, bpm:.16 },
  escuchando: { et:'ESCUCHANDO', dh:  0, sat:82, lum:60, R:.36, react:1.0, glow:1.00, spin:.075, orbit:.14, caos:0, breath:.020, bpm:.55 },
  pensando:   { et:'PENSANDO',   dh: 42, sat:70, lum:56, R:.33, react:.10, glow:.72, spin:.240, orbit:.85, caos:0, breath:.030, bpm:.90 },
  hablando:   { et:'HABLANDO',   dh:-16, sat:88, lum:66, R:.35, react:.85, glow:1.15, spin:.060, orbit:.20, caos:0, breath:.018, bpm:.45 },
  error:      { et:'ERROR',      dh:170, sat:85, lum:58, R:.32, react:.55, glow:.95, spin:.500, orbit:.30, caos:1, breath:.040, bpm:1.6 }
};
const CLAVES = Object.keys(ESTADOS);

/* Estado interpolado que se dibuja realmente en cada fotograma. */
let actual = 'dormido';
let mezcla = Object.assign({}, ESTADOS.dormido);
let desde  = Object.assign({}, ESTADOS.dormido);
let hacia  = Object.assign({}, ESTADOS.dormido);
let tMix = 1;
const DUR_MIX = 0.50;   // segundos de transicion
let sacudida = 0;       // impulso de temblor (ERROR)

function transicionar(nombre){
  if(!ESTADOS[nombre] || nombre === actual) return;
  desde = Object.assign({}, mezcla);
  hacia = ESTADOS[nombre];
  tMix = 0;
  actual = nombre;
  if(nombre === 'error') sacudida = 1;
  document.getElementById('estado').textContent = hacia.et;
  pintarBotones();
}

/* =================================================================
   3. AMPLITUD
   -----------------------------------------------------------------
   Tres fuentes intercambiables:
     sim  - envolvente de voz sintetica (para disenar sin audio real)
     mic  - microfono real via WebAudio (requiere servir por http://)
     ext  - la que empuje Python con DOOM.amplitude()
   El suavizado (ataque/caida) es clave: sin el, el orbe parpadea.
   Ataque rapido para que reaccione al instante, caida lenta para que
   no se desinfle en cada pausa entre silabas.
   ================================================================= */
let fuente = 'sim';
let ampTarget = 0, amp = 0, ampLento = 0;
const T_ATAQUE = 0.040, T_CAIDA = 0.190;

/* --- Simulador de voz: rafagas de palabra con modulacion silabica --- */
const sim = { hasta:0, hablando:false, nivel:0 };
function amplitudSimulada(t){
  if(t > sim.hasta){
    sim.hablando = !sim.hablando;
    sim.hasta = t + (sim.hablando ? 0.5 + Math.random()*1.8 : 0.12 + Math.random()*0.6);
    sim.nivel = 0.42 + Math.random()*0.5;
  }
  if(!sim.hablando) return 0.02;
  const silabas = 0.55 + 0.45*Math.sin(2*Math.PI*4.3*t + 1.4*Math.sin(2*Math.PI*0.83*t));
  const micro   = 0.88 + 0.12*Math.sin(2*Math.PI*17*t);
  return clamp(sim.nivel * silabas * micro, 0, 1);
}

/* --- Microfono real ---------------------------------------------------
   No es un boton mas: es la unica pieza del banco de pruebas que puede
   fallar por motivos ajenos al codigo (file://, permiso denegado, sin
   dispositivo). El error va a una linea del panel, no a un alert() que
   bloquea la pestana -- y que ademas los navegadores automatizados
   silencian, dejando la prueba colgada sin explicacion visible. */
let analizador = null, bufMic = null;
function mostrarErrorMic(msg){
  const el = document.getElementById('error-mic');
  el.textContent = msg; el.hidden = false;
}
function limpiarErrorMic(){
  document.getElementById('error-mic').hidden = true;
}
async function activarMicro(){
  try{
    const s  = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false}});
    const ac = new AudioContext();
    analizador = ac.createAnalyser();
    analizador.fftSize = 1024;
    ac.createMediaStreamSource(s).connect(analizador);
    bufMic = new Float32Array(analizador.fftSize);
    limpiarErrorMic();
    fuente = 'mic'; pintarBotones();
  }catch(e){
    mostrarErrorMic(
      'Microfono no disponible (' + e.name + '). Abrir el archivo con doble clic '
      + '(file://) lo bloquea, o el navegador nunca dio permiso. Sirve la carpeta '
      + 'y entra por http://localhost:8080/hud.html, o revisa el permiso de microfono.'
    );
  }
}
function amplitudMicro(){
  if(!analizador) return 0;
  analizador.getFloatTimeDomainData(bufMic);
  let s = 0;
  for(let i=0;i<bufMic.length;i++) s += bufMic[i]*bufMic[i];
  return clamp(Math.sqrt(s/bufMic.length) * 7.5, 0, 1);   // RMS escalado
}

/* --- Envolvente ligada al TTS ---------------------------------------
   speechSynthesis no expone la senal de audio, asi que no se puede medir
   su amplitud real. Lo que si emite son eventos 'boundary', uno por
   palabra. Cada uno inyecta un pulso que decae, y encima va una
   modulacion silabica continua. El resultado esta sincronizado con el
   ritmo real del habla aunque no con su forma de onda exacta.
   En produccion esto desaparece: Python medira el audio de Kokoro y
   empujara la amplitud real por DOOM.amplitude().
   --------------------------------------------------------------------- */
let pulso = 0, nBoundary = 0;
function amplitudTTS(t, dt){
  pulso = Math.max(0, pulso - dt*2.6);
  // Envolvente silabica continua: es la base, y siempre esta. Comprobado
  // que las voces SAPI de Windows NO emiten 'boundary' en Chrome, asi que
  // depender de ese evento dejaba el orbe practicamente quieto al hablar.
  const silabas = 0.50 + 0.50*Math.sin(2*Math.PI*4.6*t + 1.3*Math.sin(2*Math.PI*0.77*t));
  const micro   = 0.90 + 0.10*Math.sin(2*Math.PI*15*t);
  const base    = (0.30 + 0.58*silabas) * micro;
  // Si la voz si emite 'boundary', cada palabra acentua el pico.
  return clamp(base * (0.78 + 0.32*pulso), 0, 1);
}

/* =================================================================
   3b. TRANSPORTE: WEBSOCKET CON EL ORQUESTADOR
   -----------------------------------------------------------------
   Contrato completo en docs/decisiones.md (D-022). Resumen: el
   orquestador abre un servidor WS en 127.0.0.1 y manda JSON de una
   linea, un mensaje por evento:

     {"type":"state",     "value":"escuchando"}   al cambiar de estado
     {"type":"amplitude", "value":0.63}            30-60 Hz mientras suena
     {"type":"caption",   "value":"texto"|null}    al cambiar el subtitulo
     {"type":"reset"}                              equivalente a DOOM.reset()

   Cada mensaje es literalmente una llamada a window.DOOM: por eso el
   despacho de abajo es un mapeo directo type -> metodo, sin logica
   propia. Si no hay servidor (desarrollando sin el orquestador vivo),
   sigue disponible el banco de pruebas de mas abajo: reintenta la
   conexion cada 1.5 s sin bloquear nada.
   ================================================================= */
const WS_URL = 'ws://127.0.0.1:8765/hud';
let ws = null, wsConectado = false;

function conectarWS(){
  try{
    ws = new WebSocket(WS_URL);
  }catch(e){
    setTimeout(conectarWS, 1500);
    return;
  }
  ws.onopen = function(){
    wsConectado = true;
    pintarBadgeWS();
    // El orquestador manda 'reset' al conectar, pero por si no lo hace
    // (version vieja, o se reinicia la ventana) se sale del banco de
    // pruebas en cuanto hay servidor real al otro lado.
    pararDemo(); pararVoz();
    fuente = 'ext'; pintarBotones();
    document.getElementById('panel').classList.add('hidden');
  };
  ws.onmessage = function(ev){
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }
    if(msg.type === 'state')          DOOM.setState(msg.value);
    else if(msg.type === 'amplitude') DOOM.amplitude(msg.value);
    else if(msg.type === 'caption')   DOOM.caption(msg.value);
    else if(msg.type === 'reset')     DOOM.reset();
  };
  ws.onclose = function(){ ws = null; wsConectado = false; pintarBadgeWS(); setTimeout(conectarWS, 1500); };
  ws.onerror = function(){ if(ws) ws.close(); };
}
function pintarBadgeWS(){
  const b = document.getElementById('ws-badge');
  b.classList.toggle('on', wsConectado);
  document.getElementById('ws-texto').textContent =
    wsConectado ? 'orquestador conectado' : 'sin servidor — banco de pruebas';
}

/* =================================================================
   4. PARTICULAS Y ONDAS DE CHOQUE
   ================================================================= */
let particulas = [];
function generarParticulas(n){
  particulas = [];
  for(let i=0;i<n;i++){
    particulas.push({
      a:    Math.random()*Math.PI*2,
      r:    1.15 + Math.random()*1.25,                        // radio en multiplos del orbe
      v:    (Math.random()<.5?-1:1)*(0.04 + Math.random()*0.22),
      tam:  0.6 + Math.random()*1.9,
      fase: Math.random()*Math.PI*2
    });
  }
}
let ondas = [], ultimaOnda = -9;

/* =================================================================
   5. LIENZOS
   ================================================================= */
const fx = document.getElementById('fx'),     cx = fx.getContext('2d');
const bA = document.getElementById('bloomA'), ca = bA.getContext('2d');
const bB = document.getElementById('bloomB'), cb = bB.getContext('2d');
let W = 0, H = 0, DPR = 1;

function redimensionar(){
  const r = document.getElementById('stage').getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2);
  // Al arrancar (o en una ventana aun sin componer) el rect puede venir a 0.
  // Se usa un minimo para no dejar los lienzos en tamano cero: el
  // ResizeObserver corrige en cuanto haya medidas reales.
  W = Math.max(2, Math.round(r.width  * DPR));
  H = Math.max(2, Math.round(r.height * DPR));
  fx.width = W; fx.height = H;
  // Los lienzos de resplandor van a media resolucion: se van a desenfocar
  // igualmente, asi que el detalle sobra y ahorramos la mitad de pixeles.
  bA.width  = bB.width  = Math.round(W/2);
  bA.height = bB.height = Math.round(H/2);
}
addEventListener('resize', redimensionar);
new ResizeObserver(redimensionar).observe(document.getElementById('stage'));

/* =================================================================
   6. BUCLE DE DIBUJO
   ================================================================= */
let ultimo = performance.now()/1000, fps = 60, acumFps = 0, nFps = 0;
let kReact = 1, kGlow = 1;
const elVu = document.getElementById('vu-fill');

function frame(now){
  now /= 1000;
  const dt = Math.min(now - ultimo, 0.05);
  ultimo = now;

  /* --- interpolacion de estado --- */
  if(tMix < 1){
    tMix = Math.min(1, tMix + dt/DUR_MIX);
    const e = tMix < .5 ? 4*tMix*tMix*tMix : 1 - Math.pow(-2*tMix+2,3)/2;   // easeInOutCubic
    for(const k in hacia){
      mezcla[k] = (typeof hacia[k] === 'number')
        ? desde[k] + (hacia[k]-desde[k])*e
        : hacia[k];
    }
  }
  sacudida = Math.max(0, sacudida - dt*2.2);

  /* --- amplitud --- */
  if(fuente === 'sim')           ampTarget = amplitudSimulada(now);
  else if(fuente === 'mic')      ampTarget = amplitudMicro();
  else if(fuente === 'tts')      ampTarget = amplitudTTS(now, dt);
  else if(fuente === 'silencio') ampTarget = 0;

  const kA = 1 - Math.exp(-dt/T_ATAQUE), kC = 1 - Math.exp(-dt/T_CAIDA);
  amp      += (ampTarget - amp) * (ampTarget > amp ? kA : kC);
  ampLento += (amp - ampLento) * (1 - Math.exp(-dt/0.55));
  elVu.style.width = (amp * 100).toFixed(1) + '%';

  /* --- ondas de choque en los picos --- */
  const reactiva = (actual === 'escuchando' || actual === 'hablando');
  if(reactiva && amp > 0.5 && now - ultimaOnda > 0.22){
    ondas.push({t0:now, f:amp}); ultimaOnda = now;
  }
  ondas = ondas.filter(o => now - o.t0 < 1.1);

  dibujar(now);

  /* --- resplandor: copiar y dejar que CSS desenfoque --- */
  ca.clearRect(0,0,bA.width,bA.height);
  ca.drawImage(fx, 0,0, bA.width, bA.height);
  cb.clearRect(0,0,bB.width,bB.height);
  cb.drawImage(fx, 0,0, bB.width, bB.height);

  acumFps += 1/Math.max(dt,1e-4); nFps++;
  if(nFps >= 20){ fps = acumFps/nFps; acumFps = 0; nFps = 0; actualizarStats(); }

  requestAnimationFrame(frame);
}

function dibujar(t){
  cx.clearRect(0,0,W,H);
  // El glitch (solo ERROR) suma un temblor propio, mas nervioso que la
  // sacudida general, y offsets de color que se calculan una vez por
  // fotograma para que las tres pasadas del anillo tiemblen juntas.
  const glitch = mezcla.caos > 0.02 ? mezcla.caos : 0;
  const gx = glitch * (Math.random()-.5) * 10 * DPR;
  const cxp = W/2 + (Math.random()-.5)*sacudida*14*DPR;
  const cyp = H/2 + (Math.random()-.5)*sacudida*14*DPR;
  const S = Math.min(W,H);
  const m = mezcla;
  const H0 = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--h'));
  const H2 = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--h2'));
  const hue  = H0 + m.dh;
  const hue2 = H2 + m.dh*0.4;
  const G = m.glow * kGlow;

  const respira = 1 + m.breath*Math.sin(2*Math.PI*m.bpm*t);
  const R = S * m.R * 0.5 * respira * (1 + 0.10*ampLento);

  const col  = function(l,a,s){ return 'hsl(' + hue  + ' ' + (s===undefined?m.sat:s) + '% ' + l + '% / ' + a + ')'; };
  const col2 = function(l,a,s){ return 'hsl(' + hue2 + ' ' + (s===undefined?m.sat:s) + '% ' + l + '% / ' + a + ')'; };

  /* ---- halo duotono: cian al centro, un resto de magenta al borde ---- */
  let g = cx.createRadialGradient(cxp,cyp,0, cxp,cyp,R*2.4);
  g.addColorStop(0,    col(m.lum-2, 0.12*G));
  g.addColorStop(0.55, col(m.lum-6, 0.05*G));
  g.addColorStop(0.85, col2(m.lum-6, 0.05*G));
  g.addColorStop(1,    col2(m.lum,  0));
  cx.fillStyle = g; cx.fillRect(0,0,W,H);

  /* ---- anillos segmentados: la lectura "HUD tactico" ----
     Dos anillos de trazos discontinuos girando en sentidos opuestos,
     uno por canal de color. Es el mismo truco que un anillo de carga
     de interfaz de ciencia ficcion: gira solo, no necesita reaccionar
     a nada para leerse como "activo". */
  dibujarAnilloSegmentado(cxp, cyp, R*1.42, 46, t*m.spin*1.6,        col,  0.28*G, 2.0);
  dibujarAnilloSegmentado(cxp, cyp, R*1.58, 30, -t*m.spin*0.9 + 1.1, col2, 0.22*G, 1.6);

  /* ---- barrido de radar: un arco que gira y se apaga hacia la cola,
     mas ancho e intenso en PENSANDO (m.orbit) ---- */
  if(m.orbit > 0.02){
    const velBarrido = 1.1, ang0 = t*velBarrido;
    const segmentos = 26;
    for(let i=0;i<segmentos;i++){
      const a = ang0 - i*0.045;
      const al = m.orbit * (1 - i/segmentos) * 0.55 * G;
      cx.strokeStyle = col(m.lum+14, al);
      cx.lineWidth = 2*DPR;
      cx.beginPath();
      cx.arc(cxp,cyp, R*1.42, a, a+0.043);
      cx.stroke();
    }
  }

  /* ---- onda de choque en los picos ---- */
  cx.lineCap = 'round';
  for(const o of ondas){
    const e = (t - o.t0)/1.1;
    cx.strokeStyle = col(m.lum+16, (1-e)*(1-e)*0.30*o.f*G);
    cx.lineWidth = 1.6*(1-e)*DPR;
    cx.beginPath(); cx.arc(cxp,cyp, R*(1.02 + 1.3*e), 0, Math.PI*2); cx.stroke();
  }

  /* ---- el anillo reactivo: la firma visual ----
     En ERROR se traza tres veces con un pixelaje de color distinto
     (cian / magenta / base) desalineadas por `gx`: aberracion cromatica
     de glitch, barata porque reutiliza el mismo trazado. */
  const N = 220;
  const k = (0.14 + 1.3*amp*m.react) * kReact;
  const grosor = (1.5 + 2.4*amp*m.react) * DPR;
  const trazarAnillo = function(offx, color){
    cx.lineWidth = grosor;
    cx.strokeStyle = color;
    cx.beginPath();
    for(let i=0;i<=N;i++){
      const a = i/N*Math.PI*2;
      let d = 0.022*Math.sin(2*a + t*0.8) + 0.015*Math.sin(3*a - t*1.3) + 0.009*Math.sin(5*a + t*1.9);
      if(glitch > 0.02) d += glitch*0.04*Math.sin(23*a + t*37);
      const rr = R*(1 + k*d);
      const x = cxp + offx + Math.cos(a)*rr, y = cyp + Math.sin(a)*rr;
      if(i) cx.lineTo(x,y); else cx.moveTo(x,y);
    }
    cx.closePath(); cx.stroke();
  };
  if(glitch > 0.02){
    trazarAnillo(-gx, col2(m.lum+6, 0.55*G));
    trazarAnillo( gx, col(Math.min(m.lum+14,78), 0.55*G));
    trazarAnillo(0,   col(Math.min(m.lum+10,74), 0.85*Math.min(G,1.15), Math.min(m.sat+10,100)));
  } else {
    trazarAnillo(0, col(Math.min(m.lum+10,74), 0.92*Math.min(G,1.15), Math.min(m.sat+10,100)));
  }

  /* ---- particulas: fragmentos rectos, no motas -- como esquirlas de
     dato desprendiendose. Apagadas por defecto (slider a 0). ---- */
  for(const p of particulas){
    p.a += p.v*0.016;
    const rr = R*p.r*(1 + 0.20*amp*m.react);
    const al = (0.14 + 0.30*Math.abs(Math.sin(t*0.9 + p.fase))) * G;
    const x = cxp + Math.cos(p.a)*rr, y = cyp + Math.sin(p.a)*rr;
    const s = p.tam*DPR*1.6;
    cx.strokeStyle = (p.fase % 2 < 1) ? col(m.lum+16, al) : col2(m.lum+16, al);
    cx.lineWidth = 1.2*DPR;
    cx.beginPath(); cx.moveTo(x-s,y); cx.lineTo(x+s,y); cx.stroke();
  }
}

/* Anillo de trazos discontinuos (el "cargando" de ciencia ficcion). */
function dibujarAnilloSegmentado(cx0, cy0, radio, nSeg, rot, col, alfa, ancho){
  const hueco = 0.35;  // fraccion de cada segmento que queda vacia
  cx.lineCap = 'butt';
  cx.lineWidth = ancho*DPR;
  cx.strokeStyle = col(64, alfa);
  const paso = Math.PI*2/nSeg;
  for(let i=0;i<nSeg;i++){
    const a0 = rot + i*paso;
    cx.beginPath();
    cx.arc(cx0,cy0, radio, a0, a0 + paso*(1-hueco));
    cx.stroke();
  }
}

/* =================================================================
   7. TEXTO
   ================================================================= */
const elCap = document.getElementById('caption');
function ponerTexto(txt){
  if(!txt){ elCap.classList.remove('on'); return; }
  elCap.classList.remove('on');
  setTimeout(function(){ elCap.textContent = txt; elCap.classList.add('on'); }, 120);
}

/* =================================================================
   8. PANEL DE PRUEBAS
   ================================================================= */
const PALETAS = [
  {n:'Cian', h:190}, {n:'Hielo', h:212}, {n:'Violeta', h:268},
  {n:'Ambar', h:36}, {n:'Menta', h:158}
];
const FUENTES = [
  {id:'sim',      n:'Voz simulada'},
  {id:'silencio', n:'Silencio'},
  {id:'mic',      n:'Microfono'},
  {id:'ext',      n:'Externa (Python)'}
];

function pintarBotones(){
  document.querySelectorAll('#btn-estados button').forEach(function(b){
    b.classList.toggle('act', b.dataset.k === actual);
  });
  document.querySelectorAll('#btn-fuente button').forEach(function(b){
    b.classList.toggle('act', b.dataset.k === fuente);
  });
}

CLAVES.forEach(function(k,i){
  const b = document.createElement('button');
  b.textContent = ESTADOS[k].et.toLowerCase();
  b.dataset.k = k;
  b.title = 'tecla ' + (i+1);
  b.onclick = function(){ pararDemo(); transicionar(k); };
  document.getElementById('btn-estados').appendChild(b);
});
FUENTES.forEach(function(f){
  const b = document.createElement('button');
  b.textContent = f.n; b.dataset.k = f.id;
  b.onclick = function(){
    if(f.id === 'mic') activarMicro();
    else { fuente = f.id; pintarBotones(); }
  };
  document.getElementById('btn-fuente').appendChild(b);
});
PALETAS.forEach(function(p){
  const b = document.createElement('button');
  b.className = 'swatch'; b.title = p.n;
  b.style.background = 'hsl(' + p.h + ' 75% 55%)';
  b.onclick = function(){ document.documentElement.style.setProperty('--h', p.h); };
  document.getElementById('btn-color').appendChild(b);
});

const sR = document.getElementById('s-react'),
      sP = document.getElementById('s-part'),
      sG = document.getElementById('s-glow');

function sincroSliders(){
  kReact = sR.value/100; kGlow = sG.value/100;
  document.getElementById('v-react').textContent = kReact.toFixed(2);
  document.getElementById('v-glow').textContent  = kGlow.toFixed(2);
  document.getElementById('v-part').textContent  = sP.value;
}
sR.oninput = sG.oninput = sincroSliders;
sP.oninput = function(){ generarParticulas(+sP.value); sincroSliders(); };

function actualizarStats(){
  document.getElementById('stats').innerHTML =
    'fps ' + fps.toFixed(0) + '  &middot;  amp ' + amp.toFixed(2) + '<br>' +
    'estado ' + actual + ' &middot; fuente ' + fuente + '<br><br>' +
    '<kbd>1</kbd>-<kbd>5</kbd> estado &middot; <kbd>D</kbd> ciclo &middot; <kbd>H</kbd> panel<br>' +
    '<kbd>espacio</kbd> hablarle &middot; <kbd>Ctrl</kbd>+<kbd>Enter</kbd> decir';
  actualizarLectura();
}

/* Lectura decorativa bajo el estado: un identificador que cambia poco
   (no en cada fotograma, eso distraeria) mas el nivel actual. Solo
   estetica -- no es un dato real del orquestador, es la misma clase de
   detalle que un HUD de pelicula pone para que la pantalla se lea como
   instrumento y no como un simple icono animado. */
let idNodo = null;
function actualizarLectura(){
  if(idNodo === null || Math.random() < 0.04){
    idNodo = Math.floor(Math.random()*0xFFFF).toString(16).toUpperCase().padStart(4,'0');
  }
  document.getElementById('lectura').textContent =
    'NIVEL ' + amp.toFixed(2) + '  ·  NODO 0x' + idNodo;
}

/* --- ciclo de demostracion: la conversacion completa --- */
let demo = [];
function pararDemo(){ demo.forEach(clearTimeout); demo = []; }
function lanzarDemo(){
  pararDemo();
  const paso = function(ms,f){ demo.push(setTimeout(f,ms)); };
  transicionar('dormido'); ponerTexto(''); fuente = 'silencio'; pintarBotones();
  paso(  900, function(){ transicionar('escuchando'); fuente='sim';      pintarBotones(); });
  paso( 4200, function(){ transicionar('pensando');   fuente='silencio'; pintarBotones(); ponerTexto('…'); });
  paso( 6100, function(){ transicionar('hablando');   fuente='sim';      pintarBotones();
                          ponerTexto('Diecinueve grados en el exterior. Cielo despejado hasta la tarde.'); });
  paso(11500, function(){ transicionar('dormido');    fuente='silencio'; pintarBotones(); ponerTexto(''); });
}
document.getElementById('b-demo').onclick = lanzarDemo;

addEventListener('keydown', function(e){
  if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  const n = parseInt(e.key,10);
  if(n >= 1 && n <= CLAVES.length){ pararDemo(); transicionar(CLAVES[n-1]); }
  if(e.key.toLowerCase() === 'd') lanzarDemo();
  if(e.key.toLowerCase() === 'h') document.getElementById('panel').classList.toggle('hidden');
  if(e.code === 'Space' && !e.repeat){ e.preventDefault(); empezarEscucha(); }
});
addEventListener('keyup', function(e){
  if(e.code === 'Space') terminarEscucha();
});

/* =================================================================
   8b. BANCO DE PRUEBAS DE TEXTO Y VOZ
   -----------------------------------------------------------------
   Esto NO forma parte del HUD definitivo. Sirve para recorrer el ciclo
   completo con voz de verdad sin haber montado todavia Kokoro ni
   Whisper, y asi juzgar el ritmo: cuanto tarda en arrancar, como
   acompana la animacion al habla, si la cadencia suena a asistente.

   Usa speechSynthesis, el sintetizador del sistema. En Windows son las
   voces SAPI instaladas (Helena, Pablo, Sabina...), que se ejecutan en
   local. Chrome ademas ofrece voces "Google", que NO son locales: se
   sintetizan en servidores de Google. El desplegable las marca para que
   no se cuelen en un proyecto que quiere ser 100% offline.

   No se usa reconocimiento de voz del navegador por lo mismo: la
   Web Speech API de Chrome envia el audio a Google. El microfono se usa
   aqui solo para medir amplitud, que es un calculo local.
   ================================================================= */
const elTxt   = document.getElementById('txt');
const elVoz   = document.getElementById('sel-voz');
const elRate  = document.getElementById('s-rate');
const elNota  = document.getElementById('nota-voz');
let vocesDisp = [];

function cargarVoces(){
  vocesDisp = speechSynthesis.getVoices()
    .filter(function(v){ return /^(es|en)/i.test(v.lang); })
    .sort(function(a,b){
      // Locales primero, y dentro de esas, espanol primero.
      if(a.localService !== b.localService) return a.localService ? -1 : 1;
      return a.lang.localeCompare(b.lang);
    });
  elVoz.innerHTML = '';
  vocesDisp.forEach(function(v,i){
    const o = document.createElement('option');
    o.value = i;
    o.textContent = (v.localService ? '[local] ' : '[nube] ') + v.name + '  (' + v.lang + ')';
    elVoz.appendChild(o);
  });
  const nLocal = vocesDisp.filter(function(v){ return v.localService; }).length;
  elNota.textContent = vocesDisp.length
    ? nLocal + ' voces locales de ' + vocesDisp.length + '. Las marcadas [nube] sintetizan en servidores de Google.'
    : 'Sin voces disponibles en este navegador.';
}
speechSynthesis.onvoiceschanged = cargarVoces;
cargarVoces();

function sincroRate(){
  document.getElementById('v-rate').textContent = (elRate.value/100).toFixed(2) + '×';
}
elRate.oninput = sincroRate;

/* Recorre el ciclo real: PENSANDO breve -> HABLANDO sincronizado -> DORMIDO */
let locucion = null;
function decir(texto){
  if(!texto || !texto.trim()) return;
  pararDemo(); pararVoz();

  transicionar('pensando');
  fuente = 'silencio'; pintarBotones();
  ponerTexto('');

  const u = new SpeechSynthesisUtterance(texto.trim());
  const v = vocesDisp[+elVoz.value];
  if(v){ u.voice = v; u.lang = v.lang; }
  u.rate  = elRate.value/100;   // por debajo de 1 = mas pausado
  u.pitch = 0.95;               // ligeramente grave

  u.onstart = function(){
    transicionar('hablando');
    fuente = 'tts'; pulso = 1; pintarBotones();
    ponerTexto(texto.trim());
  };
  u.onboundary = function(){ pulso = 1; nBoundary++; };   // un pico por palabra, si la voz los emite
  u.onend = function(){
    transicionar('dormido');
    fuente = 'silencio'; pintarBotones();
    ponerTexto('');
    locucion = null;
  };
  u.onerror = function(){ transicionar('error'); fuente = 'silencio'; pintarBotones(); };

  locucion = u;
  // Pequena espera antes de hablar: da tiempo a ver el estado PENSANDO
  // y es exactamente lo que ocurrira en real mientras el LLM arranca.
  setTimeout(function(){ if(locucion === u) speechSynthesis.speak(u); }, 650);
}
function pararVoz(){
  locucion = null;
  speechSynthesis.cancel();
}

document.getElementById('b-decir').onclick = function(){ decir(elTxt.value); };
document.getElementById('b-parar').onclick = function(){
  pararVoz(); transicionar('dormido'); fuente='silencio'; pintarBotones(); ponerTexto('');
};
elTxt.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) decir(elTxt.value);
  e.stopPropagation();               // que 1-5 / D / H no actuen al escribir
});

/* --- Pulsar y mantener para "hablarle": estado ESCUCHANDO con mic real --- */
const bEsc = document.getElementById('b-escuchar');
let escuchando = false;
async function empezarEscucha(){
  if(escuchando) return;
  escuchando = true;
  pararDemo(); pararVoz();
  if(!analizador) await activarMicro();
  if(!analizador){ escuchando = false; return; }
  transicionar('escuchando'); fuente = 'mic'; pintarBotones();
}
function terminarEscucha(){
  if(!escuchando) return;
  escuchando = false;
  transicionar('pensando'); fuente = 'silencio'; pintarBotones();
  // Sin STT local todavia: se simula el turno de respuesta.
  setTimeout(function(){ if(actual === 'pensando') decir(elTxt.value); }, 900);
}
bEsc.addEventListener('mousedown', empezarEscucha);
addEventListener('mouseup', terminarEscucha);

/* =================================================================
   9. ARRANQUE
   ================================================================= */
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
redimensionar();
generarParticulas(+sP.value);
sincroSliders();
sincroRate();
pintarBotones();
pintarBadgeWS();
requestAnimationFrame(frame);
conectarWS();
setTimeout(function(){ if(!wsConectado) lanzarDemo(); }, 500);
